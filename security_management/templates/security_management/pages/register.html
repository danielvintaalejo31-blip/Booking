<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Salon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 420px;
            border: 2px solid #000000;
        }

        .salon-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .salon-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #000000;
            font-size: 28px;
        }

        .tagline {
            text-align: center;
            color: #000000;
            font-size: 14px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #000000;
            font-weight: 600;
            font-size: 14px;
        }

        .password-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #000000;
            border-radius: 25px;
            font-size: 14px;
            background-color: #ffffff;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #000000;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .bottom-text {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
        }

        .bottom-text a {
            color: #000000;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .decorative-line {
            height: 2px;
            background: #000000;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="salon-header">
        <div class="salon-icon">💅</div>
        <h2>Create Account</h2>
        <p class="tagline">Join our beauty community</p>
    </div>

    <div class="decorative-line"></div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" required id="id_username">
        </div>

        <div class="form-group">
            <label for="id_password1">Password</label>
            <div class="password-wrapper">
                <input type="password" name="password1" required id="id_password1">
                <button type="button" class="toggle-password" onclick="togglePassword('id_password1', 'eye1')">
                    <span id="eye1">👁️</span>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="id_password2">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" name="password2" required id="id_password2">
                <button type="button" class="toggle-password" onclick="togglePassword('id_password2', 'eye2')">
                    <span id="eye2">👁️</span>
                </button>
            </div>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="bottom-text">
        Already have an account? <a href="{% url 'appointments:login' %}">Login here</a>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}
</script>

</body>
</html>
