<!-- apartments/templates/molecules/service_card.html -->
<!-- Displays a single service with booking option -->

<div class="service-card">
    {% if service.image %}
        <img src="{{ service.image.url }}" alt="{{ service.name }}" class="service-image">
    {% else %}
        <div class="service-image-placeholder">
            <span class="placeholder-icon">💇</span>
        </div>
    {% endif %}
    
    <div class="service-content">
        <div class="service-header">
            <h3 class="service-name">{{ service.name }}</h3>
            <span class="service-category-badge">{{ service.get_category_display }}</span>
        </div>
        
        <p class="service-description">{{ service.description|truncatewords:20 }}</p>
        
        <div class="service-details">
            <div class="service-info">
                <span class="price">₱{{ service.price }}</span>
                <span class="duration">{{ service.duration }} mins</span>
            </div>
            
            <a href="{% url 'appointment_form' %}?service={{ service.id }}" class="btn-book">
                Book Now
            </a>
        </div>
    </div>
</div>

<style>
.service-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.service-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.service-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.service-image-placeholder {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.placeholder-icon {
    font-size: 60px;
}

.service-content {
    padding: 20px;
}

.service-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 10px;
}

.service-name {
    font-size: 20px;
    font-weight: 600;
    color: #2d3748;
    margin: 0;
}

.service-category-badge {
    background: #e6fffa;
    color: #047857;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}

.service-description {
    color: #718096;
    font-size: 14px;
    line-height: 1.6;
    margin: 10px 0;
}

.service-details {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
}

.service-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.price {
    font-size: 24px;
    font-weight: 700;
    color: #2d3748;
}

.duration {
    color: #718096;
    font-size: 14px;
}

.btn-book {
    background: #667eea;
    color: white;
    padding: 10px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s ease;
}

.btn-book:hover {
    background: #5568d3;
}
</style>
